name: Nightly Plugin Version Bump

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-plugin-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bump changed plugin versions
        id: bump-plugin-versions
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          # Compare each plugin's own history: a plugin is due a bump when a commit touched its
          # plugins/<name>/ tree after the last commit that changed its manifest version. A
          # squash merge that carries its own bump therefore needs none.
          $plugins = @()
          foreach ($dir in (Get-ChildItem -Directory plugins | Sort-Object Name)) {
              $name = $dir.Name
              $manifest = "plugins/$name/.claude-plugin/plugin.json"
              if (-not (Test-Path -LiteralPath $manifest)) { $manifest = "plugins/$name/.github/plugin/plugin.json" }
              if (-not (Test-Path -LiteralPath $manifest)) { continue }

              $versionCommit = git log -1 --format=%H -G '"version"' -- $manifest
              if ([string]::IsNullOrWhiteSpace($versionCommit)) { continue }
              $since = [int](git rev-list --count "$versionCommit..HEAD" -- "plugins/$name/")
              if ($since -gt 0) {
                  Write-Host "$name - $since commit(s) since version commit $($versionCommit.Substring(0, 7))"
                  $plugins += $name
              }
          }

          if ($plugins.Count -eq 0) {
              Write-Host "No plugin changed since its last version bump."
              "updated=false" >> $env:GITHUB_OUTPUT
              exit 0
          }

          # A version lives in four places - both manifests, the marketplace entry, and the
          # copilot-plugins.md row - and nothing generates one from another. bump-version.mjs
          # writes the same value into all four; check-assets.mjs then fails if any disagree.
          foreach ($name in $plugins) {
              node tools/bump-version.mjs $name patch
              if ($LASTEXITCODE -ne 0) { throw "bump failed for $name" }
          }
          node tools/check-assets.mjs
          if ($LASTEXITCODE -ne 0) { throw "check-assets failed after the bump" }
          "updated=true" >> $env:GITHUB_OUTPUT

      - name: Create pull request
        if: steps.bump-plugin-versions.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: nightly bump plugin versions"
          title: "chore: nightly bump plugin versions"
          body: |
            Automated nightly plugin version bump.

            This PR increments the patch version - in both manifests, the marketplace entry, and the `copilot-plugins.md` row - of every plugin whose `plugins/<name>/` tree changed since its version last changed.
          branch: chore/nightly-plugin-version-bump
          delete-branch: true
